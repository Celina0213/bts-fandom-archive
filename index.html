<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARMY Echoes · Home</title>
  <link rel="stylesheet" href="css/style.css?v=20261110d">
</head>
<body class="home-body">
  <!-- 3D parallax background (same as archive) -->
  <div class="bg-3d" aria-hidden="true">
    <div class="bg-3d-layer bg-3d-photo"></div>
    <div class="bg-3d-layer bg-3d-glow"></div>
    <div class="bg-3d-layer bg-3d-vignette"></div>
  </div>

  <main class="home-hero">
    <p class="home-eyebrow">BTS Fandom Archive · WebTech Project</p>
    <h1 class="home-title">💜 ARMY <span>Echoes</span></h1>
    <p class="home-tagline">
      Pin your memories to the songs. Comment on each slice like a forum thread.
      Listen together in the live lounge.
    </p>

    <!-- Login card -->
    <section class="home-login" aria-label="Sign in">
      <!-- Already has profile: welcome back view -->
      <div id="welcomeView" hidden>
        <div class="home-welcome-row">
          <span class="home-avatar" id="welcomeAvatar">?</span>
          <div>
            <p class="home-welcome-title">Welcome back, <b id="welcomeNick">ARMY</b></p>
            <p class="home-welcome-sub" id="welcomeSub"></p>
          </div>
        </div>
        <button type="button" class="btn-primary home-enter-btn" id="enterBtn">Enter the Archive →</button>
        <button type="button" class="home-switch-link" id="switchUserBtn">Not you? Sign in as someone else</button>
      </div>

      <!-- Login form -->
      <form id="homeLoginForm" hidden>
        <div class="home-form-group">
          <label for="homeNick">Your ARMY nickname</label>
          <input type="text" id="homeNick" maxlength="20" placeholder="e.g. ARMY_Seoul" required autocomplete="off">
        </div>
        <div class="home-form-row">
          <div class="home-form-group">
            <label for="homeIp">Region</label>
            <select id="homeIp"></select>
          </div>
          <div class="home-form-group">
            <label for="homeStatus">Status</label>
            <select id="homeStatus"></select>
          </div>
        </div>
        <button type="submit" class="btn-primary home-enter-btn">Sign in &amp; Enter →</button>
        <p class="home-login-hint">Your nickname appears on comments and in the Listening Lounge.</p>
      </form>
    </section>

    <footer class="home-footer">
      <a href="archive.html">Skip sign-in and just browse →</a>
    </footer>
  </main>

  <script>
    (function () {
      "use strict";
      var PROFILE_KEY = "army_echoes_profile";
      var IP_OPTIONS = ["Beijing", "Shanghai", "Guangdong", "Taipei", "Hong Kong", "Seoul", "Busan", "Tokyo", "Los Angeles", "New York", "London", "Paris", "Bangkok", "Singapore", "Overseas"];
      var STATUS_OPTIONS = ["Listening", "Sleeping", "Studying", "Eating", "Slacking off", "Daydreaming"];

      var ipSelect = document.getElementById("homeIp");
      var statusSelect = document.getElementById("homeStatus");
      IP_OPTIONS.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o; op.textContent = o;
        ipSelect.appendChild(op);
      });
      STATUS_OPTIONS.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o; op.textContent = o;
        statusSelect.appendChild(op);
      });

      var welcomeView = document.getElementById("welcomeView");
      var loginForm = document.getElementById("homeLoginForm");

      function loadProfile() {
        try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || "null"); } catch (e) { return null; }
      }

      function showWelcome(p) {
        loginForm.hidden = true;
        welcomeView.hidden = false;
        document.getElementById("welcomeAvatar").textContent = p.nick.trim().charAt(0).toUpperCase();
        document.getElementById("welcomeNick").textContent = p.nick;
        document.getElementById("welcomeSub").textContent = "IP " + p.ip + " · " + p.status;
      }

      var saved = loadProfile();
      if (saved && saved.nick) {
        showWelcome(saved);
      } else {
        loginForm.hidden = false;
      }

      document.getElementById("switchUserBtn").addEventListener("click", function () {
        welcomeView.hidden = true;
        loginForm.hidden = false;
        var nick = document.getElementById("homeNick");
        nick.value = "";
        nick.focus();
      });

      document.getElementById("enterBtn").addEventListener("click", function () {
        window.location.href = "archive.html";
      });

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var nick = document.getElementById("homeNick").value.trim();
        if (!nick) return;
        var profile = { nick: nick, ip: ipSelect.value, status: statusSelect.value };
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
        window.location.href = "archive.html";
      });
    })();
  </script>
</body>
</html>
