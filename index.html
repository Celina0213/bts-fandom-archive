<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ARMY Echoes - BTS 粉丝时空胶囊与同频听歌房互动平台">
  <meta property="og:title" content="ARMY Echoes - BTS Fandom Archive">
  <meta property="og:description" content="记录每一段花样年华，与全球阿米同频聆听。">
  <meta property="og:type" content="website">
  <title>ARMY Echoes - BTS 时空胶囊与同频听歌房</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2226%22 font-size=%2228%22>💜</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">💜 ARMY Echoes</div>
    <nav class="era-nav" aria-label="时代选择">
      <ul id="eraList"></ul>
    </nav>
  </header>

  <main class="main-layout">
    <aside class="sidebar" aria-label="曲目导航">
      <h2 id="sidebarTitle">收录曲目</h2>
      <ul class="song-list" id="songList"></ul>
    </aside>

    <section class="stage" aria-label="核心展示区">
      <div class="view-switch">
        <button class="tab-btn active" id="tabSliceBtn">📸 时空切片画卷</button>
        <button class="tab-btn" id="tabChatBtn">💬 同频听歌房 (<span id="listenerBadge">1,280</span> 人)</button>
      </div>

      <!-- 模式 A：切片画卷展示 -->
      <div class="slice-container" id="sliceContainer">
        <div class="slice-viewer">
          <img id="sliceImg" src="" alt="取景地回忆打卡图" loading="lazy">
          <div class="slice-gradient-overlay"></div>
          <div class="slice-info">
            <span class="location-badge" id="sliceLocation">加载中...</span>
            <p class="caption-text" id="sliceCaption">回忆读取中...</p>
            <span class="author-tag" id="sliceAuthor">by ARMY</span>
          </div>
        </div>

        <div class="carousel-controls">
          <button class="ctrl-btn" id="prevSlice" title="上一张">◀</button>
          <div class="slice-indicators" id="sliceIndicators"></div>
          <button class="ctrl-btn" id="nextSlice" title="下一张">▶</button>
        </div>

        <div class="upload-trigger-area">
          <button class="btn-primary" id="openUploadBtn">+ 上传我的同款回忆切片</button>
        </div>
      </div>

      <!-- 模式 B：同频听歌房聊天室 -->
      <div class="chat-container" id="chatContainer" style="display: none;">
        <div class="chat-header">
          <div class="room-status">
            <span class="pulse-dot"></span>
            <span>正在与全球阿米同步聆听此曲</span>
          </div>
          <button class="heart-cheer-btn" id="cheerBtn" title="发射紫心应援">💜 应援 (<span id="cheerCount">777</span>)</button>
        </div>

        <div class="chat-messages" id="chatBox" role="log" aria-live="polite"></div>

        <form class="chat-form" id="chatForm">
          <input type="text" id="chatInput" placeholder="输入此刻听歌的共鸣感受..." maxlength="100" autocomplete="off" required>
          <button type="submit" class="btn-primary">发送</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="player-bar">
    <div class="track-info">
      <span class="track-title" id="playerTitle">Spring Day (봄날)</span>
      <span class="track-meta" id="playerMeta">BTS · You Never Walk Alone</span>
    </div>
    <div class="player-controls">
      <div class="audio-status" id="audioStatus">音频待命</div>
      <button class="btn-ctrl" id="playBtn">▶ 播放</button>
    </div>
  </footer>

  <!-- 上传回忆模态弹窗 -->
  <dialog class="modal" id="uploadModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>💜 上传你的同款回忆</h3>
        <button class="close-btn" id="closeUploadBtn">&times;</button>
      </div>
      <form id="uploadForm">
        <div class="form-group">
          <label for="formLocation">打卡取景地 / 城市</label>
          <input type="text" id="formLocation" placeholder="例如：江陵 · 香湖海边巴士站" required>
        </div>
        <div class="form-group">
          <label for="formImage">照片 URL 地址</label>
          <input type="url" id="formImage" placeholder="https://example.com/photo.jpg" required>
        </div>
        <div class="form-group">
          <label for="formAuthor">你的阿米昵称</label>
          <input type="text" id="formAuthor" placeholder="例如：ARMY_Seoul" required>
        </div>
        <div class="form-group">
          <label for="formCaption">关于这首歌的回忆或旅行见闻</label>
          <textarea id="formCaption" rows="3" placeholder="写下当时听这首歌的心情或现场故事..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelUploadBtn">取消</button>
          <button type="submit" class="btn-primary">确认发布</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
